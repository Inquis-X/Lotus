version: 2
disclaimer: "Синтетический учебный материал. Сроки и условия вымышлены; это не нормативный акт и не правовая рекомендация."
order_title: "Порядок подготовки материалов о предоставлении муниципального земельного участка без проведения торгов"
clauses:
  - [function, "1. Подразделение по земельным отношениям обеспечивает выполнение функции «Предоставление муниципальных земельных участков без проведения торгов»."]
  - [procedure, "1.1. Рассмотрение заявления включает регистрацию, проверку документов, подготовку проекта, принятие решения и направление результата."]
  - [stage, "1.1.1. Сотрудник делопроизводства регистрирует заявление и передаёт его специалисту подразделения в день поступления."]
  - [stage, "1.1.2. Специалист сверяет заявление и приложения с требованиями статьи 39.17 Земельного кодекса Российской Федерации и проверяет основания для возврата заявления."]
  - [stage, "1.1.3. {decision}"]
  - [role, "1.1.3.1. Специалист подразделения готовит проект и указывает в нём правовое основание предоставления участка либо мотивы отказа."]
  - [control, "1.1.3.2. Начальник подразделения сверяет выводы проекта с материалами заявления и фиксирует результат проверки в листе согласования."]
  - [stage, "1.1.4. Уполномоченное должностное лицо рассматривает проверенный проект и оформляет результат в соответствии с пунктом 5 статьи 39.17 Земельного кодекса Российской Федерации."]
  - [stage, "1.1.5. Сотрудник делопроизводства направляет заявителю результат и вносит дату и способ отправки в регистрационную карточку."]
