edition: "Учебная редакция 1"
notice: "Синтетические учебные ситуации. Не судебные акты и не результаты исследования реальных дел."
cases:
  - code: "LAND-01"
    title: "Критерии подготовки решения о предоставлении участка"
    sphere: "Земельные отношения"
    function: "Предоставление земельных участков"
    circumstances: "В учебной процедуре специалист готовит проект решения, а руководитель его согласует."
    mechanism: "Учебная гипотеза: неопределённые критерии могут создавать условия для неодинакового рассмотрения сходных заявлений."
    conditions: "В представленном фрагменте не описана проверка применения критериев."
    controls: "Проверить наличие критериев и независимой проверки их применения в полном комплекте документов."
    observable: "Описание этапа подготовки решения и содержание листа согласования."
    limitations: "Фрагмент не позволяет заключить, что критерии отсутствуют во всём комплекте. Аналогия не подтверждает нарушение."
  - code: "PROPERTY-01"
    title: "Разделение подготовки и проверки проекта распоряжения"
    sphere: "Муниципальное имущество"
    function: "Распоряжение муниципальным имуществом"
    circumstances: "В учебной процедуре одна должностная роль готовит проект и проверяет комплектность приложений."
    mechanism: "Учебная гипотеза: совмещение подготовки и проверки может ограничивать независимость контроля."
    conditions: "Не установлено, предусмотрено ли отдельное согласование перед принятием решения."
    controls: "Уточнить распределение ролей и полномочия согласующего участника."
    observable: "Роли на этапах подготовки, проверки и согласования проекта."
    limitations: "Совмещение отдельных действий само по себе не устанавливает уязвимость. Требуется анализ процедуры в целом."
